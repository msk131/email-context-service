version: '3.9'
services:
  web:
    build: .
    container_name: email-context-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app:cached

  db:
    image: postgres:16-alpine
    container_name: email-context-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mani12345
      POSTGRES_DB: email_context
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
